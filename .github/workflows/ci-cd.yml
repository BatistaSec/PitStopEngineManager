name: PitStopEngine CI/CD Pipeline (Semana 1 & Semana 2)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 🏎️ Semana 1: Build & Test Core Championship Service (Java 21 + Spring Boot)
  core-championship-ci:
    name: Build & Test Core Championship (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Maven Unit & Integration Tests
        run: |
          cd services/core-championship
          mvn clean test --batch-mode

      - name: Build Production JAR Package
        run: |
          cd services/core-championship
          mvn package -DskipTests --batch-mode

      - name: Upload Core Championship Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-championship-service
          path: services/core-championship/target/*.jar
          retention-days: 7

  # 💻 Semana 2: Build & Verify Frontend Pit Wall (Next.js + TypeScript + TailwindCSS)
  frontend-ci:
    name: Build & Verify Frontend Pit Wall (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Verify Next.js Production Build
        run: |
          cd frontend
          npm run build

  # 🐳 Validação da Infraestrutura Docker (PostgreSQL & RabbitMQ)
  docker-infra-ci:
    name: Verify Docker Compose (PostgreSQL & RabbitMQ)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
