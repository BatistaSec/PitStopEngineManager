name: PitStopEngine CI/CD Pipeline (Semana 1)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 🏎️ Semana 1: Build & Test Core Championship Service (Java 21 + Spring Boot)
  core-championship-ci:
    name: Build & Test Core Championship (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Maven Unit & Integration Tests
        run: |
          cd services/core-championship
          mvn clean test --batch-mode

      - name: Build Production JAR Package
        run: |
          cd services/core-championship
          mvn package -DskipTests --batch-mode

      - name: Upload Core Championship Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-championship-service
          path: services/core-championship/target/*.jar
          retention-days: 7

  # 🐳 Validação da Infraestrutura Docker (PostgreSQL - Semana 1)
  docker-infra-ci:
    name: Verify Docker Compose (PostgreSQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
