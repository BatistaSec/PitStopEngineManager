version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pitstop_postgres
    environment:
      POSTGRES_DB: pitstop_championship
      POSTGRES_USER: pitstop
      POSTGRES_PASSWORD: pitstop_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitstop -d pitstop_championship"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
